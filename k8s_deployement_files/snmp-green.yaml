apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-microservice-green
  namespace: snmp
  labels:
    app: snmp-microservice
    version: green

spec:
  replicas: 1

  selector:
    matchLabels:
      app: snmp-microservice
      version: green

  template:
    metadata:
      labels:
        app: snmp-microservice
        version: green

    spec:
      containers:
        - name: snmp-microservice
          image: 10.161.5.175:5000/snmp-microservice:6