apiVersion: v1
kind: Service

metadata:
  name: snmp-trap-bluegreen-service
  namespace: snmp

spec:
  type: NodePort

  selector:
    app: snmp-trap-service
    version: blue

  ports:
    - name: http
      protocol: TCP
      port: 8085
      targetPort: 8085
      nodePort: 30185

    - name: snmp-trap
      protocol: UDP
      port: 162
      targetPort: 162
      nodePort: 30162