apiVersion: apps/v1
kind: Deployment

metadata:
  name: usermanagement-green
  namespace: snmp
  labels:
    app: usermanagement
    version: green

spec:
  replicas: 1

  selector:
    matchLabels:
      app: usermanagement
      version: green

  template:
    metadata:
      labels:
        app: usermanagement
        version: green

    spec:
      containers:
        - name: usermanagement-container
          image: 10.161.5.175:5000/usermanagement:3
          imagePullPolicy: Always

          ports:
            - containerPort: 9991